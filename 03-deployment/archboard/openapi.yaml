openapi: 3.1.0
info:
  title: Archboard API
  version: 1.0.0
  summary: Backend for the system-design interview platform.
  description: |
    HTTP contract for the backend expected by the frontend in `frontend/`.
    It is derived from the frontend services layer:

    * `frontend/src/services/api.ts` — one method per endpoint (the comment on each
      method names the endpoint it maps to)
    * `frontend/src/services/types.ts` — request and response shapes
    * `frontend/src/canvas/types.ts` — canvas document and operation shapes
    * `frontend/src/services/mock/mockBackend.ts` — reference behaviour (validation,
      authorization, error codes)

    ## Authentication

    Two kinds of caller, both using bearer tokens:

    | Scheme       | Who                          | How it is obtained                                   | Sent as                              |
    |--------------|------------------------------|------------------------------------------------------|--------------------------------------|
    | `userAuth`   | Signed-in interviewers       | `POST /v1/auth/magic-link/verify` or `POST /v1/auth/login` → `accessToken` | `Authorization: Bearer <accessToken>`|
    | `guestAuth`  | People who joined via a link | `POST /v1/join/{token}` → `credential`               | `X-Guest-Credential: <credential>`   |

    A guest credential is scoped to exactly one session. When a request carries both
    headers, the guest credential takes precedence for that session (a signed-in
    interviewer can open a candidate link in another tab to test it).

    Endpoints that list `security: [{userAuth: []}, {guestAuth: []}]` accept **either**
    scheme. Endpoints with `security: []` are public.

    ## Authorization

    Checked server-side on every request and every WebSocket message (see
    `frontend/src/services/permissions.ts` for the full matrix):

    * Owner-only endpoints return **404 `NOT_FOUND`** to anyone who is not the session
      owner, so session ids cannot be probed.
    * A caller with no valid credential for a session gets **401 `UNAUTHENTICATED`**.
    * A removed participant gets **403 `PARTICIPANT_REMOVED`**.

    ## Errors

    Every non-2xx response has the `Error` body `{ code, message }`. `message` is
    human-readable and shown to users as-is; `code` is stable.

    ## Real-time

    `GET /v1/sessions/{sessionId}/ws` upgrades to a WebSocket. Message schemas are
    `ClientMessage` and `ServerMessage` in `components/schemas`; every message is
    wrapped in an envelope `{ v: 1, sessionId, id }`.

    ## Conventions

    * JSON field names are camelCase.
    * Timestamps are ISO-8601 strings in UTC.
    * Ids are opaque strings generated by the server (canvas element and operation ids
      are generated by clients).
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: auth
    description: Interviewer sign-in via email magic link.
  - name: sessions
    description: Interview sessions, lifecycle and settings.
  - name: participants
    description: People in a session.
  - name: guest-links
    description: Shareable invitation links (bearer tokens).
  - name: join
    description: Public lobby and join flow for invited guests.
  - name: canvas
    description: Canvas snapshot, clearing and snapshots.
  - name: realtime
    description: WebSocket collaboration channel.

security:
  - userAuth: []

paths:
  # ------------------------------------------------------------------ auth --

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the signed-in interviewer
      description: The frontend treats `401` as "not signed in" (`getCurrentUser()` returns `null`).
      security:
        - userAuth: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Email a sign-in link
      description: |
        Sends a single-use sign-in link valid for 15 minutes. The email address is
        trimmed and lower-cased. Development servers may return the token as `devToken`
        so the flow can be completed without email; production servers must omit it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkRequestInput' }
      responses:
        '200':
          description: Link sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MagicLinkRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/auth/magic-link/verify:
    post:
      tags: [auth]
      operationId: verifyMagicLink
      summary: Exchange a magic-link token for an access token
      description: |
        Consumes the token (single use). Creates the user on first sign-in; a new user
        receives an example ended session. Returns the access token to send as
        `Authorization: Bearer <accessToken>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyMagicLinkInput' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '404':
          description: '`LINK_INVALID` — unknown, already used or expired token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Alternative to the magic link for users who have a password (e.g. the seeded
        demo accounts). Passwords are stored as salted scrypt hashes. Unknown emails,
        wrong passwords and accounts without a password all get the same `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: Revoke the current access token
      description: Idempotent; succeeds even when the token is already invalid.
      security:
        - userAuth: []
        - {}
      responses:
        '204': { description: Signed out. }

  # -------------------------------------------------------------- sessions --

  /v1/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List sessions for the dashboard
      description: |
        Sessions the user owns plus sessions they joined as an interviewer or observer,
        including archived ones, ordered by `lastModifiedAt` descending.
      responses:
        '200':
          description: Session summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [sessions]
      operationId: createSession
      summary: Create a draft session
      description: |
        Creates a session in state `draft` with an empty canvas, or with a copy of the
        canvas of `templateSessionId` (which the caller must own).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get session metadata
      security:
        - userAuth: []
        - guestAuth: []
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [sessions]
      operationId: updateSession
      summary: Update settings or editing lock
      description: |
        Only fields present in the body are changed.

        * `title`, `prompt`, `durationMinutes`, `scheduledAt`, `showCursors` — owner only.
        * `candidateEditingEnabled` — owner or interviewer, while the session is `draft` or `live`.

        Broadcasts `session_updated` to the room.
      security:
        - userAuth: []
        - guestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSessionInput' }
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/sessions/{sessionId}/start:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start a draft session (owner)
      description: '`draft` → `live`; sets `startedAt`. Broadcasts `session_updated`.'
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: endSession
      summary: End the session (owner)
      description: |
        `draft` or `live` → `ended`; sets `endedAt` and saves a `final` canvas snapshot.
        The canvas becomes read-only for everyone. Broadcasts `session_ended`.
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/sessions/{sessionId}/reopen:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: reopenSession
      summary: Reopen an ended session (owner)
      description: '`ended` → `live`; clears `endedAt`. Broadcasts `session_updated`.'
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/sessions/{sessionId}/archive:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: archiveSession
      summary: Archive the session (owner)
      description: |
        Any state → `archived`. If the session was `live`, a `final` snapshot is saved
        and `endedAt` is set. Guest links stop working. Broadcasts `session_ended`.
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sessions/{sessionId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: duplicateSession
      summary: Duplicate as a new draft (owner)
      description: Copies title (suffixed with " (copy)"), prompt, duration and canvas.
      responses:
        '201':
          description: The new draft session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- participants --

  /v1/sessions/{sessionId}/participants:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [participants]
      operationId: listParticipants
      summary: List participants
      description: Non-removed participants, ordered by `joinedAt`.
      security:
        - userAuth: []
        - guestAuth: []
      responses:
        '200':
          description: Participants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Participant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sessions/{sessionId}/participants/{participantId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: participantId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [participants]
      operationId: removeParticipant
      summary: Remove a participant (owner)
      description: |
        Sets `removedAt`; the participant's credential stops working immediately.
        Broadcasts `participant_removed` and `participants_changed`. The owner cannot be
        removed.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ----------------------------------------------------------- guest links --

  /v1/sessions/{sessionId}/guest-links:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [guest-links]
      operationId: listGuestLinks
      summary: List invitation links (owner)
      description: All links including revoked/expired ones, newest first. Tokens are never returned.
      responses:
        '200':
          description: Links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GuestLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [guest-links]
      operationId: createGuestLink
      summary: Create or rotate an invitation link (owner)
      description: |
        Returns the bearer `token` **once**; only its hash is stored. The token must
        carry at least 128 bits of entropy. With `rotate: true`, all other non-revoked
        links granting the same role are revoked first. Not allowed for `ended` or
        `archived` sessions.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGuestLinkInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedGuestLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_ENDED` — reopen the session before sharing it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/sessions/{sessionId}/guest-links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: linkId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [guest-links]
      operationId: revokeGuestLink
      summary: Revoke an invitation link (owner)
      description: |
        Idempotent. Blocks new joins; participants who already joined keep their access.
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ join --

  /v1/join/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The invitation token from the shared link (`/join/{token}`).
        schema: { type: string }
    get:
      tags: [join]
      operationId: getJoinInfo
      summary: Lobby information for an invitation link
      security: []
      responses:
        '200':
          description: The link is valid and the session is joinable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinInfo' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '409': { $ref: '#/components/responses/NotJoinable' }
        '410': { $ref: '#/components/responses/LinkGone' }
    post:
      tags: [join]
      operationId: joinSession
      summary: Join a session through an invitation link
      description: |
        Validates the link, creates a participant with the link's role and returns a
        guest `credential` for `X-Guest-Credential`.

        * Increments the link's `uses`.
        * Rejects with `SESSION_FULL` when 10 participants are already active
          (seen within the last 30 seconds).
        * **Reconnect:** when the request carries a valid `X-Guest-Credential` for this
          session, the same participant is returned (display name updated) without
          consuming a use or re-checking capacity, and the same credential is returned.
        * If the caller is signed in (`userAuth`) and the link grants `interviewer` or
          `observer`, the participant is linked to that user so the session appears on
          their dashboard.

        Broadcasts `participants_changed`.
      security:
        - {}
        - userAuth: []
        - guestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinInput' }
      responses:
        '200':
          description: Joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResult' }
        '403':
          description: '`PARTICIPANT_REMOVED` — this credential belongs to a removed participant.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '409': { $ref: '#/components/responses/NotJoinable' }
        '410': { $ref: '#/components/responses/LinkGone' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- canvas --

  /v1/sessions/{sessionId}/canvas:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [canvas]
      operationId: openRoom
      summary: Open the interview room
      description: |
        Everything needed to render the room: session, the caller's participant record
        (created for the owner on first access), participants, the canvas snapshot with
        its operation cursor, and the caller's permissions.

        Candidates and observers can open the room only while the session is `draft` or
        `live`; owners and interviewers can also open ended sessions (read-only).
      security:
        - userAuth: []
        - guestAuth: []
      responses:
        '200':
          description: Room state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_ENDED` — the session has ended and the caller may not view it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`SESSION_ARCHIVED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/sessions/{sessionId}/canvas/clear:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [canvas]
      operationId: clearCanvas
      summary: Clear the canvas (owner)
      description: |
        Saves a `before-clear` snapshot, then replaces the canvas with an empty
        document and advances the cursor. Broadcasts `canvas_reset`. Only while the
        session is `draft` or `live`.
      responses:
        '204': { description: Cleared. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_ENDED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/sessions/{sessionId}/canvas/snapshots:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [canvas]
      operationId: listSnapshots
      summary: List saved canvas snapshots (owner)
      description: Newest first. Snapshot contents are not included.
      responses:
        '200':
          description: Snapshots.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CanvasSnapshotInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sessions/{sessionId}/canvas/snapshots/{snapshotId}/restore:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: snapshotId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [canvas]
      operationId: restoreSnapshot
      summary: Restore a snapshot (owner)
      description: |
        Saves a `before-restore` snapshot of the current canvas, then replaces it with
        the snapshot's document and advances the cursor. Broadcasts `canvas_reset`.
        Only while the session is `draft` or `live`.
      responses:
        '204': { description: Restored. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_ENDED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # -------------------------------------------------------------- realtime --

  /v1/sessions/{sessionId}/ws:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [realtime]
      operationId: connectRealtime
      summary: Collaboration WebSocket
      description: |
        Upgrades to a WebSocket. Browsers cannot set headers on WebSocket requests, so
        credentials are passed as query parameters (`access_token` for users,
        `guest_credential` for guests); the same precedence rules apply as for HTTP.

        **After connecting** the server sends `room_joined` with the current cursor.
        On every reconnect the client re-fetches `GET /canvas`, re-applies its
        unacknowledged operations and re-sends them (the server de-duplicates by
        operation id).

        **Client → server** (`ClientMessage`):
        * `document_update` — persistent canvas change. Authorized on **every**
          message: the sender must be a non-removed participant with edit permission
          (`computePermissions`), and `op.actorId` must equal the sender's participant
          id. The operation is validated (`validateOperation`: max 500 changes, text
          ≤ 2000 chars, stroke ≤ 20 000 points, known element kinds; canvas ≤ 5000
          entries), applied with last-writer-wins by `version`, persisted, acknowledged
          with `document_ack` and fanned out as `document_update` to every **other**
          connection. A duplicate operation id is acknowledged but not re-broadcast.
          A rejected operation gets `error` with its `opId` (`EDIT_LOCKED`,
          `SESSION_ENDED`, `FORBIDDEN`, `VALIDATION`).
        * `presence_update` — ephemeral cursor/selection; never stored. The server
          overwrites `participantId` with the sender's id and fans it out.
        * `ping` → `pong`.

        **Server → client** (`ServerMessage`) additionally carries room events caused
        by HTTP calls: `session_updated`, `session_ended`, `participants_changed`,
        `participant_removed`, `canvas_reset`, and `presence_leave` when a connection
        closes.

        If the credential is invalid on connect, the server sends one `error` message
        (e.g. `UNAUTHENTICATED`, `PARTICIPANT_REMOVED`) and closes.
      security:
        - userQuery: []
        - guestQuery: []
      responses:
        '101':
          description: Switching protocols. Messages follow `ClientMessage` / `ServerMessage`.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      description: Interviewer access token from `POST /v1/auth/magic-link/verify`.
    guestAuth:
      type: apiKey
      in: header
      name: X-Guest-Credential
      description: Per-session participant credential from `POST /v1/join/{token}`.
    userQuery:
      type: apiKey
      in: query
      name: access_token
      description: Interviewer access token, for the WebSocket handshake only.
    guestQuery:
      type: apiKey
      in: query
      name: guest_credential
      description: Guest credential, for the WebSocket handshake only.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }

  responses:
    SessionOk:
      description: The updated session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InterviewSession' }
    Unauthenticated:
      description: '`UNAUTHENTICATED` — missing or invalid credentials.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`FORBIDDEN` or `PARTICIPANT_REMOVED`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND` — does not exist, or the caller is not allowed to know it exists.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: '`CONFLICT` — invalid state transition.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: '`VALIDATION` — invalid input; `message` explains which field.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LinkInvalid:
      description: '`LINK_INVALID` — unknown token.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LinkGone:
      description: '`LINK_REVOKED`, `LINK_EXPIRED`, `LINK_EXHAUSTED` or `SESSION_ARCHIVED`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotJoinable:
      description: '`SESSION_ENDED` or `SESSION_FULL`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ------------------------------------------------------------ common --
    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }

    ErrorCode:
      type: string
      description: |
        Stable error code and its HTTP status:
        UNAUTHENTICATED 401, FORBIDDEN 403, NOT_FOUND 404, VALIDATION 422,
        LINK_INVALID 404, LINK_REVOKED 410, LINK_EXPIRED 410, LINK_EXHAUSTED 410,
        SESSION_ENDED 409, SESSION_ARCHIVED 410, SESSION_FULL 409, EDIT_LOCKED 403,
        PARTICIPANT_REMOVED 403, CONFLICT 409.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION
        - LINK_INVALID
        - LINK_REVOKED
        - LINK_EXPIRED
        - LINK_EXHAUSTED
        - SESSION_ENDED
        - SESSION_ARCHIVED
        - SESSION_FULL
        - EDIT_LOCKED
        - PARTICIPANT_REMOVED
        - CONFLICT

    Timestamp:
      type: string
      format: date-time

    NullableTimestamp:
      type: [string, 'null']
      format: date-time

    SessionState:
      type: string
      enum: [draft, live, ended, archived]

    Role:
      type: string
      enum: [owner, interviewer, candidate, observer]

    GuestRole:
      type: string
      enum: [interviewer, candidate, observer]

    # -------------------------------------------------------------- auth --
    User:
      type: object
      required: [id, email, displayName, organizationId, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        organizationId: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    MagicLinkRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    MagicLinkRequest:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean, const: true }
        devToken:
          type: string
          description: Development only.

    VerifyMagicLinkInput:
      type: object
      required: [token]
      properties:
        token: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`.'

    # ---------------------------------------------------------- sessions --
    InterviewSession:
      type: object
      required:
        - id
        - ownerUserId
        - title
        - prompt
        - state
        - candidateEditingEnabled
        - showCursors
        - durationMinutes
        - scheduledAt
        - startedAt
        - endedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
        prompt: { type: string, maxLength: 10000 }
        state: { $ref: '#/components/schemas/SessionState' }
        candidateEditingEnabled: { type: boolean }
        showCursors: { type: boolean }
        durationMinutes: { type: [integer, 'null'], minimum: 5, maximum: 480 }
        scheduledAt: { $ref: '#/components/schemas/NullableTimestamp' }
        startedAt: { $ref: '#/components/schemas/NullableTimestamp' }
        endedAt: { $ref: '#/components/schemas/NullableTimestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    SessionSummary:
      allOf:
        - $ref: '#/components/schemas/InterviewSession'
        - type: object
          required: [participantNames, lastModifiedAt, activeGuestLink]
          properties:
            participantNames:
              type: array
              description: Display names of non-owner, non-removed participants.
              items: { type: string }
            lastModifiedAt:
              $ref: '#/components/schemas/Timestamp'
              description: Latest of the session's `updatedAt` and the canvas' last change.
            activeGuestLink:
              description: Newest active `candidate` link, or null.
              oneOf:
                - $ref: '#/components/schemas/GuestLink'
                - type: 'null'

    CreateSessionInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed; must not be blank.
        prompt: { type: string, maxLength: 10000, default: '' }
        durationMinutes: { type: [integer, 'null'], minimum: 5, maximum: 480 }
        scheduledAt: { $ref: '#/components/schemas/NullableTimestamp' }
        templateSessionId:
          type: [string, 'null']
          description: Copy the canvas of this session (must be owned by the caller).

    UpdateSessionInput:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        prompt: { type: string, maxLength: 10000 }
        durationMinutes: { type: [integer, 'null'], minimum: 5, maximum: 480 }
        scheduledAt: { $ref: '#/components/schemas/NullableTimestamp' }
        candidateEditingEnabled: { type: boolean }
        showCursors: { type: boolean }

    # ------------------------------------------------------ participants --
    Participant:
      type: object
      required: [id, sessionId, userId, displayName, role, color, joinedAt, leftAt, removedAt, lastSeenAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        userId: { type: [string, 'null'] }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role' }
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Assigned by the server from a fixed palette.
        joinedAt: { $ref: '#/components/schemas/Timestamp' }
        leftAt: { $ref: '#/components/schemas/NullableTimestamp' }
        removedAt: { $ref: '#/components/schemas/NullableTimestamp' }
        lastSeenAt: { $ref: '#/components/schemas/NullableTimestamp' }

    # ------------------------------------------------------- guest links --
    GuestLink:
      type: object
      required: [id, sessionId, roleGranted, expiresAt, maxUses, uses, revokedAt, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        roleGranted: { $ref: '#/components/schemas/GuestRole' }
        expiresAt: { $ref: '#/components/schemas/NullableTimestamp' }
        maxUses: { type: [integer, 'null'], minimum: 1 }
        uses: { type: integer, minimum: 0 }
        revokedAt: { $ref: '#/components/schemas/NullableTimestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    CreateGuestLinkInput:
      type: object
      properties:
        roleGranted:
          $ref: '#/components/schemas/GuestRole'
          default: candidate
        expiresAt: { $ref: '#/components/schemas/NullableTimestamp' }
        maxUses: { type: [integer, 'null'], minimum: 1 }
        rotate:
          type: boolean
          default: false
          description: Revoke other active links granting the same role.

    CreatedGuestLink:
      type: object
      required: [link, token]
      properties:
        link: { $ref: '#/components/schemas/GuestLink' }
        token:
          type: string
          description: Bearer token (≥128 bits of entropy, URL-safe). Returned only here; the join URL is `/join/{token}`.

    # -------------------------------------------------------------- join --
    JoinInfo:
      type: object
      required: [sessionTitle, sessionState, roleGranted]
      properties:
        sessionTitle: { type: string }
        sessionState: { $ref: '#/components/schemas/SessionState' }
        roleGranted: { $ref: '#/components/schemas/GuestRole' }

    JoinInput:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed; must not be blank.

    JoinResult:
      type: object
      required: [sessionId, participant, credential]
      properties:
        sessionId: { type: string }
        participant: { $ref: '#/components/schemas/Participant' }
        credential:
          type: string
          description: Send as `X-Guest-Credential` for requests about this session. Only its hash is stored.

    # ------------------------------------------------------------ canvas --
    Permissions:
      type: object
      description: Result of the permission matrix for the caller's role and the session state.
      required: [canView, canEdit, canLockEditing, canShare, canRemoveParticipants, canStartOrEnd, canClearCanvas, canEditSettings]
      properties:
        canView: { type: boolean }
        canEdit: { type: boolean }
        canLockEditing: { type: boolean }
        canShare: { type: boolean }
        canRemoveParticipants: { type: boolean }
        canStartOrEnd: { type: boolean }
        canClearCanvas: { type: boolean }
        canEditSettings: { type: boolean }

    RoomAccess:
      type: object
      required: [session, me, participants, canvas, cursor, permissions]
      properties:
        session: { $ref: '#/components/schemas/InterviewSession' }
        me: { $ref: '#/components/schemas/Participant' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        canvas: { $ref: '#/components/schemas/CanvasDoc' }
        cursor:
          type: integer
          minimum: 0
          description: Sequence number of the last operation included in `canvas`.
        permissions: { $ref: '#/components/schemas/Permissions' }

    CanvasSnapshotInfo:
      type: object
      required: [id, sessionId, reason, operationCursor, elementCount, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        reason:
          type: string
          enum: [final, before-clear, periodic, before-restore]
        operationCursor: { type: integer, minimum: 0 }
        elementCount: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    CanvasDoc:
      type: object
      description: |
        Last-writer-wins element map. Deleted elements remain as tombstones so that
        late or duplicate operations converge.
      required: [schemaVersion, elements]
      properties:
        schemaVersion: { type: integer, const: 1 }
        elements:
          type: object
          description: Keyed by element id.
          additionalProperties: { $ref: '#/components/schemas/ElementEntry' }

    ElementEntry:
      oneOf:
        - $ref: '#/components/schemas/CanvasElement'
        - $ref: '#/components/schemas/Tombstone'

    Stamp:
      type: object
      description: Lamport stamp. Higher `clock` wins; ties are broken by comparing `actor` strings.
      required: [clock, actor]
      properties:
        clock: { type: integer, minimum: 0 }
        actor: { type: string, description: Participant id of the writer. }

    Tombstone:
      type: object
      required: [id, deleted, version]
      properties:
        id: { type: string }
        deleted: { type: boolean, const: true }
        version: { $ref: '#/components/schemas/Stamp' }

    CanvasElement:
      oneOf:
        - $ref: '#/components/schemas/ShapeElement'
        - $ref: '#/components/schemas/ConnectorElement'
        - $ref: '#/components/schemas/StrokeElement'
      discriminator:
        propertyName: kind
        mapping:
          shape: '#/components/schemas/ShapeElement'
          connector: '#/components/schemas/ConnectorElement'
          stroke: '#/components/schemas/StrokeElement'

    ElementBase:
      type: object
      required: [id, kind, z, version, createdBy, createdAt, updatedBy]
      properties:
        id: { type: string, description: Client-generated. }
        kind: { type: string, enum: [shape, connector, stroke] }
        z: { type: number, description: Layer order; higher is drawn on top. }
        groupId: { type: [string, 'null'] }
        version: { $ref: '#/components/schemas/Stamp' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedBy: { type: string }

    ShapeElement:
      allOf:
        - $ref: '#/components/schemas/ElementBase'
        - type: object
          required: [kind, componentType, x, y, w, h, label]
          properties:
            kind: { type: string, const: shape }
            componentType: { $ref: '#/components/schemas/ComponentType' }
            x: { type: number }
            y: { type: number }
            w: { type: number, exclusiveMinimum: 0 }
            h: { type: number, exclusiveMinimum: 0 }
            label: { type: string, maxLength: 2000 }
            description: { type: string, maxLength: 2000 }
            fill: { type: string, description: CSS colour override (e.g. sticky note colour). }

    Anchor:
      type: string
      enum: [auto, top, right, bottom, left]

    Endpoint:
      type: object
      description: Attached to `elementId` when present (follows the element); otherwise a free point.
      required: [x, y]
      properties:
        elementId: { type: string }
        anchor: { $ref: '#/components/schemas/Anchor' }
        x: { type: number }
        y: { type: number }

    ConnectorElement:
      allOf:
        - $ref: '#/components/schemas/ElementBase'
        - type: object
          required: [kind, from, to, routing, arrowStart, arrowEnd, label, dashed, color, width]
          properties:
            kind: { type: string, const: connector }
            from: { $ref: '#/components/schemas/Endpoint' }
            to: { $ref: '#/components/schemas/Endpoint' }
            routing: { type: string, enum: [straight, elbow, curved] }
            arrowStart: { type: boolean }
            arrowEnd: { type: boolean }
            label: { type: string, maxLength: 2000 }
            dashed: { type: boolean }
            color: { type: string }
            width: { type: integer, enum: [1, 2, 3] }

    StrokeElement:
      allOf:
        - $ref: '#/components/schemas/ElementBase'
        - type: object
          required: [kind, tool, points, color, width]
          properties:
            kind: { type: string, const: stroke }
            tool: { type: string, enum: [pen, highlighter] }
            points:
              type: array
              description: Flat list of world coordinates `[x0, y0, x1, y1, …]`.
              maxItems: 40000
              items: { type: number }
            color: { type: string }
            width: { type: number, exclusiveMinimum: 0 }

    ComponentType:
      type: string
      enum:
        - service
        - rounded
        - rectangle
        - ellipse
        - text
        - sticky
        - boundary
        - icon
        - sql-db
        - nosql-db
        - cache
        - object-storage
        - warehouse
        - queue
        - stream
        - pubsub
        - client
        - browser
        - mobile
        - api-gateway
        - load-balancer
        - cdn
        - external-api
        - server
        - worker
        - function
        - cluster
        - llm
        - embedding
        - vector-db
        - agent

    Change:
      oneOf:
        - $ref: '#/components/schemas/PutChange'
        - $ref: '#/components/schemas/DeleteChange'
      discriminator:
        propertyName: type
        mapping:
          put: '#/components/schemas/PutChange'
          delete: '#/components/schemas/DeleteChange'

    PutChange:
      type: object
      required: [type, element]
      properties:
        type: { type: string, const: put }
        element: { $ref: '#/components/schemas/CanvasElement' }

    DeleteChange:
      type: object
      required: [type, id, version]
      properties:
        type: { type: string, const: delete }
        id: { type: string }
        version: { $ref: '#/components/schemas/Stamp' }

    CanvasOperation:
      type: object
      required: [id, actorId, changes]
      properties:
        id: { type: string, description: Client-generated; used for de-duplication. }
        actorId: { type: string, description: Must equal the sender's participant id. }
        changes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Change' }

    # ---------------------------------------------------------- realtime --
    Presence:
      type: object
      required: [participantId, displayName, color, role, cursor, selection, ts]
      properties:
        participantId: { type: string }
        displayName: { type: string }
        color: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        cursor:
          description: World coordinates, or null when the pointer left the canvas.
          oneOf:
            - type: object
              required: [x, y]
              properties:
                x: { type: number }
                y: { type: number }
            - type: 'null'
        selection:
          type: array
          items: { type: string }
        ts: { type: number, description: Client timestamp in ms; presence expires after 10 s without updates. }

    Envelope:
      type: object
      description: Fields present on every WebSocket message, in both directions.
      required: [v, sessionId, id]
      properties:
        v: { type: integer, const: 1, description: Protocol version. }
        sessionId: { type: string }
        id: { type: string, description: Message / correlation id. }

    ClientMessage:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - oneOf:
            - type: object
              required: [type, op]
              properties:
                type: { type: string, const: document_update }
                op: { $ref: '#/components/schemas/CanvasOperation' }
            - type: object
              required: [type, presence]
              properties:
                type: { type: string, const: presence_update }
                presence: { $ref: '#/components/schemas/Presence' }
            - type: object
              required: [type]
              properties:
                type: { type: string, const: ping }

    ServerMessage:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - oneOf:
            - type: object
              description: Sent after connecting and after every reconnect.
              required: [type, participantId, cursor]
              properties:
                type: { type: string, const: room_joined }
                participantId: { type: string }
                cursor: { type: integer }
            - type: object
              description: Another participant's operation.
              required: [type, op, cursor]
              properties:
                type: { type: string, const: document_update }
                op: { $ref: '#/components/schemas/CanvasOperation' }
                cursor: { type: integer }
            - type: object
              description: The sender's operation was persisted (or was a duplicate).
              required: [type, opId, cursor]
              properties:
                type: { type: string, const: document_ack }
                opId: { type: string }
                cursor: { type: integer }
            - type: object
              required: [type, presence]
              properties:
                type: { type: string, const: presence_update }
                presence: { $ref: '#/components/schemas/Presence' }
            - type: object
              required: [type, participantId]
              properties:
                type: { type: string, const: presence_leave }
                participantId: { type: string }
            - type: object
              description: Someone joined; clients re-fetch the participant list.
              required: [type]
              properties:
                type: { type: string, const: participants_changed }
            - type: object
              required: [type, session]
              properties:
                type: { type: string, const: session_updated }
                session: { $ref: '#/components/schemas/InterviewSession' }
            - type: object
              required: [type, session]
              properties:
                type: { type: string, const: session_ended }
                session: { $ref: '#/components/schemas/InterviewSession' }
            - type: object
              required: [type, participantId]
              properties:
                type: { type: string, const: participant_removed }
                participantId: { type: string }
            - type: object
              description: The canvas was cleared or restored; clients re-fetch `GET /canvas` and drop pending operations and undo history.
              required: [type]
              properties:
                type: { type: string, const: canvas_reset }
            - type: object
              required: [type, code, message]
              properties:
                type: { type: string, const: error }
                code: { $ref: '#/components/schemas/ErrorCode' }
                message: { type: string }
                opId: { type: string, description: Set when a specific operation was rejected. }
            - type: object
              required: [type]
              properties:
                type: { type: string, const: pong }
