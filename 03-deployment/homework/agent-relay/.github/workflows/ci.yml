name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: agent-relay
  KIND_CLUSTER_NAME: agent-relay
  # Must match the kind release that created the cluster (`kind version`).
  KIND_VERSION: v0.33.0
  PG_URL: postgresql+psycopg://relay:relay@localhost:5432/agent_relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: agent_relay
        # Jobs run directly on the runner (not in a container), so the
        # service is reached through a published port on localhost.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Starter tests (SQLite)
        run: uv run pytest -q test_agent_relay.py

      - name: Starter tests (PostgreSQL)
        env:
          RELAY_DATABASE_URL: ${{ env.PG_URL }}
        run: uv run pytest -q test_agent_relay.py

      - name: Start API against PostgreSQL
        env:
          RELAY_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          nohup uv run uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ready && exit 0
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Integration test (scenario 1)
        env:
          RELAY_BASE_URL: http://127.0.0.1:8000
        run: |
          # The test skips (rather than fails) when the server is unreachable;
          # in CI a skip means the test did not run, so treat it as a failure.
          uv run pytest -v -rs test_integration_scenario1.py | tee pytest.log
          if grep -q -i skipped pytest.log; then echo "integration test was skipped"; exit 1; fi

      - name: API log
        if: always()
        run: cat uvicorn.log || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute unique image tag
        id: tag
        run: |
          tag="${GITHUB_SHA::12}-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}"
          echo "image=${IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_NAME}:${tag}"

      - name: Install kind and kubectl
        run: |
          arch=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${arch}"
          curl -fsSLo "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/${arch}/kubectl"
          chmod +x "$HOME/.local/bin/kind" "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then echo "KUBECONFIG_DATA secret is not set"; exit 1; fi
          echo "$KUBECONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Check cluster access
        run: |
          docker version --format 'Docker server {{.Server.Version}}'
          kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
          kubectl cluster-info

      - name: Build image
        run: docker build -t "${{ steps.tag.outputs.image }}" .

      - name: Load image into kind
        run: kind load docker-image "${{ steps.tag.outputs.image }}" --name "$KIND_CLUSTER_NAME"

      - name: Deploy
        run: |
          mkdir -p "$RUNNER_TEMP/k8s"
          cp k8s/*.yaml "$RUNNER_TEMP/k8s/"
          sed -i "s|image: ${IMAGE_NAME}:local|image: ${{ steps.tag.outputs.image }}|" "$RUNNER_TEMP/k8s/api-deployment.yaml"
          grep -q "image: ${{ steps.tag.outputs.image }}" "$RUNNER_TEMP/k8s/api-deployment.yaml"
          kubectl apply -f "$RUNNER_TEMP/k8s/"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/agent-relay-api --timeout=180s
          kubectl get deployment agent-relay-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe deployment agent-relay-api || true
          kubectl logs deployment/agent-relay-api --all-containers --tail=100 || true
