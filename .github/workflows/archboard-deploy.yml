# Archboard (03-deployment/archboard): deploy one environment. Called by archboard.yml.
#   terraform apply -> build and push the image -> roll out over SSM -> check /health
name: archboard-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "dev or prod (03-deployment/archboard/terraform/envs/)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write # GitHub OIDC token -> AWS role

env:
  AWS_REGION: us-east-1
  # Created by terraform/bootstrap; only the main branch of this repo can assume it.
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::027654771042:role/archboard-github-deploy
  TERRAFORM_VERSION: 1.13.4
  ENV: ${{ inputs.environment }}

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    concurrency:
      group: archboard-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: 03-deployment/archboard/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false # plain stdout, so `terraform output -raw` works

      - name: Terraform init
        run: ./init.sh "$ENV"
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var-file="envs/$ENV.tfvars"
      - name: Read outputs
        id: tf
        run: |
          {
            echo "repo=$(terraform output -raw ecr_repository_url)"
            echo "instance=$(terraform output -raw instance_id)"
            echo "url=$(terraform output -raw url)"
            echo "version=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        working-directory: 03-deployment/archboard
        env:
          REPO: ${{ steps.tf.outputs.repo }}
          VERSION: ${{ steps.tf.outputs.version }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build --build-arg APP_VERSION="$VERSION" -t "$REPO:$VERSION" -t "$REPO:latest" .
          docker push "$REPO:$VERSION"
          docker push "$REPO:latest"

      - name: Roll out to the instance
        run: ./rollout.sh "$AWS_REGION" "${{ steps.tf.outputs.instance }}"

      - name: Health check
        run: ./healthcheck.sh "${{ steps.tf.outputs.url }}" "${{ steps.tf.outputs.version }}"

      - name: Summary
        run: echo "Deployed ${{ steps.tf.outputs.version }} to $ENV at ${{ steps.tf.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
