# Archboard (03-deployment/archboard) CI/CD:
#   backend + frontend tests (parallel) -> docker compose integration + e2e tests
#   -> on main: deploy to dev, then prod (archboard-deploy.yml: terraform apply, build and
#      push the image, roll out, check /health)
name: archboard

on:
  push:
    branches: [main]
    paths:
      - "03-deployment/archboard/**"
      - "!03-deployment/archboard/**/*.md"
      - ".github/workflows/archboard.yml"
      - ".github/workflows/archboard-deploy.yml"
  pull_request:
    paths:
      - "03-deployment/archboard/**"
      - "!03-deployment/archboard/**/*.md"
      - ".github/workflows/archboard.yml"
      - ".github/workflows/archboard-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 03-deployment/archboard

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 03-deployment/archboard/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: 03-deployment/archboard/backend/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 03-deployment/archboard/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03-deployment/archboard/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test

  integration:
    name: Integration and e2e tests (docker compose)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: 03-deployment/archboard/backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            03-deployment/archboard/frontend/package-lock.json
            03-deployment/archboard/e2e/package-lock.json
      - name: Build the docker compose stack
        # The test suites start their own stacks from it; this build fills the layer cache they reuse.
        run: docker compose build
      - name: Integration tests (app + Postgres)
        run: make test-compose
      - name: Frontend HTTP client against the backend
        run: |
          (cd frontend && npm ci)
          make test-integration
      - name: Install Playwright
        working-directory: 03-deployment/archboard/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: 03-deployment/archboard/e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: 03-deployment/archboard/e2e/playwright-report
          retention-days: 7

  deploy-dev:
    name: Deploy to dev
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # GitHub OIDC token -> AWS role
    uses: ./.github/workflows/archboard-deploy.yml
    with:
      environment: dev

  # Same commit, promoted only once dev is up and healthy on it.
  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/archboard-deploy.yml
    with:
      environment: prod
