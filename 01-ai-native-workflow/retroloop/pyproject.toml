[project]
name = "retroloop"
version = "0.1.0"
description = "Weekly Team Feedback Tool"
requires-python = "==3.14.*"
dependencies = [
    "django==6.0",
    "psycopg[binary]==3.3",
    "gunicorn==26.0",
    "django-environ==0.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "pytest-django==4.12.0",
    "ruff==0.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
