{% extends "chores/base.html" %}
{% block title %}Create member — Chorely{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px;">
  <h1>Create member</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="overdue-label">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn" type="submit">Create member</button>
    <a class="btn secondary" href="{% url 'member_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
